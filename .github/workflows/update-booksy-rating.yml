name: Update Booksy rating

on:
  schedule:
    # 06:00 Europe/Kyiv (UTC+2/+3) ~ 03:00-04:00 UTC depending on DST
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-rating:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest Booksy rating (leaves data.json untouched on any failure)
        run: node scripts/update-booksy-rating.mjs

      - name: Commit and push if the rating changed
        run: |
          if git diff --quiet -- content/data.json; then
            echo "No change — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/data.json
          git commit -m "Auto-update Booksy rating"
          git push
